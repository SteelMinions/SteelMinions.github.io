<div id="piecefall-carousel" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img
        src="img/games/piecefall/piecefall_poster.webp"
        class="d-block w-100"
        alt="Piecefall Poster"
      />
    </div>

    <div class="carousel-item">
      <img
        src="img/games/piecefall/piecefall_gply1.jpg"
        class="d-block w-100"
        alt="Piecefall Gameplay 1"
      />
    </div>

    <div class="carousel-item">
      <img
        src="img/games/piecefall/piecefall_gply2.avif"
        class="d-block w-100"
        alt="Piecefall Gameplay 2"
      />
    </div>

    <div class="carousel-item">
      <img
        src="img/games/piecefall/piecefall_gply3.avif"
        class="d-block w-100"
        alt="Piecefall Gameplay 3"
      />
    </div>

    <div class="carousel-item">
      <img
        src="img/games/piecefall/piecefall_gply4.jpg"
        class="d-block w-100"
        alt="Piecefall Gameplay 4"
      />
    </div>
  </div>

  <button
    class="carousel-control-prev"
    type="button"
    data-bs-target="#piecefall-carousel"
    data-bs-slide="prev"
  >
    <span class="carousel-control-prev-icon"></span>
  </button>

  <button
    class="carousel-control-next"
    type="button"
    data-bs-target="#piecefall-carousel"
    data-bs-slide="next"
  >
    <span class="carousel-control-next-icon"></span>
  </button>
</div>
