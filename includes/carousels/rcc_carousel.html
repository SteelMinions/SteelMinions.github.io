<div id="rcc-carousel" class="rcc-carousel carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img
        src="img/games/rcc/A0_racecar_crashers_.png"
        class="d-block w-100"
        alt="Racecar Crashers Poster"
      />
    </div>

    <div class="carousel-item">
      <img
        src="img/games/rcc/rcc_gply1.avif"
        class="d-block w-100"
        alt="Racecar Crashers Gameplay 1"
      />
    </div>

    <div class="carousel-item">
      <img
        src="img/games/rcc/rcc_gply2.avif"
        class="d-block w-100"
        alt="Racecar Crashers Gameplay 2"
      />
    </div>

    <div class="carousel-item">
      <img
        src="img/games/rcc/rcc_gply3.avif"
        class="d-block w-100"
        alt="Racecar Crashers Gameplay 3"
      />
    </div>
  </div>

  <button
    class="carousel-control-prev"
    type="button"
    data-bs-target="#rcc-carousel"
    data-bs-slide="prev"
  >

  </button>

  <button
    class="carousel-control-next"
    type="button"
    data-bs-target="#rcc-carousel"
    data-bs-slide="next"
  >
    <span class="carousel-control-next-icon"></span>
  </button>
