<div id="theChantry-carousel" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img
        src="img/games/theChantry/theChantry_poster.webp"
        class="d-block w-100"
        alt="The Chantry Poster"
      />
    </div>

    <div class="carousel-item">
      <img
        src="img/games/theChantry/theChantry_gply1.avif"
        class="d-block w-100"
        alt="The Chantry Gameplay 1"
      />
    </div>

    <div class="carousel-item">
      <img
        src="img/games/theChantry/theChantry_gply2.avif"
        class="d-block w-100"
        alt="The Chantry Gameplay 2"
      />
    </div>

    <div class="carousel-item">
      <img
        src="img/games/theChantry/theChantry_gply3.jpg"
        class="d-block w-100"
        alt="The Chantry Gameplay 3"
      />
    </div>

    <div class="carousel-item">
      <img
        src="img/games/theChantry/theChantry_gply4.jpg"
        class="d-block w-100"
        alt="The Chantry Gameplay 4"
      />
    </div>
  </div>

  <button
    class="carousel-control-prev"
    type="button"
    data-bs-target="#theChantry-carousel"
    data-bs-slide="prev"
  >
    <span class="carousel-control-prev-icon"></span>
  </button>

  <button
    class="carousel-control-next"
    type="button"
    data-bs-target="#theChantry-carousel"
    data-bs-slide="next"
  >
    <span class="carousel-control-next-icon"></span>
  </button>
</div>
